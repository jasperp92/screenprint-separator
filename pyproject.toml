[project]
name = "screenprint-separator"
version = "0.3.0"
description = "Three-colour screen-print separation tool"
readme = "README.md"
authors = [
    { name = "Jasper Precht", email = "jasper.precht@web.de" }
]
requires-python = ">=3.13"
dependencies = [
    "nicegui>=3.15.0",
    "numpy>=2.5.1",
    "pillow>=12.3.0",
]

[project.scripts]
screenprint-separator = "screenprint_separator.app:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
link-mode = "copy"

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]
