name: Build macOS App

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS application
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python and project dependencies
        run: |
          uv python install 3.13
          uv sync --frozen --dev

      - name: Build native macOS app
        run: |
          uv run --with pyinstaller --with pywebview nicegui-pack \
            --name ScreenprintSeparator \
            --windowed \
            --onedir \
            --clean \
            --noconfirm \
            --add-data "color_library.json:." \
            src/screenprint_separator/app.py

      - name: Package application
        id: package
        shell: bash
        run: |
          architecture="$(uname -m)"
          archive="ScreenprintSeparator-macOS-${architecture}.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            dist/ScreenprintSeparator.app "${archive}"
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenprintSeparator-macOS
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: Create GitHub release if needed
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --generate-notes

      - name: Attach app to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "${{ steps.package.outputs.archive }}" --clobber
